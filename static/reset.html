<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ryder Admin — Reset Password</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', Arial, sans-serif; background: #f3f7ff; margin: 0; }
        .login-container { max-width: 400px; margin: 4rem auto; background: #fff; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); padding: 2rem 1.5rem; }
        h1 { text-align: center; color: #2563eb; font-size: 1.5rem; }
        label { display: block; margin: 0.5rem 0 0.2rem 0; color: #374151; }
        input { width: 100%; padding: 0.5rem; margin-bottom: 0.7rem; border-radius: 6px; border: 1px solid #bbb; box-sizing: border-box; }
        button { width: 100%; background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 0.6rem 1.5rem; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 0.5rem; }
        button:hover { background: #1741a6; }
        .message { border-radius: 8px; padding: 0.6rem 0.9rem; margin-bottom: 1rem; font-size: 0.9rem; display: none; }
        .message.error { background: #fee2e2; color: #991b1b; }
        .links { text-align: center; margin-top: 1rem; font-size: 0.9rem; }
        .links a { color: #2563eb; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Set New Password</h1>
        <div id="message" class="message"></div>
        <form id="reset-form">
            <label for="password">New password (min 8 characters)</label>
            <input type="password" id="password" autocomplete="new-password" minlength="8" required>
            <label for="password2">Confirm new password</label>
            <input type="password" id="password2" autocomplete="new-password" minlength="8" required>
            <button type="submit">Set password</button>
            <div class="links"><a href="/login">Back to sign in</a></div>
        </form>
    </div>
    <script>
        function showMessage(text) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.className = 'message error';
            el.style.display = 'block';
        }
        document.getElementById('reset-form').onsubmit = async (e) => {
            e.preventDefault();
            const p1 = document.getElementById('password').value;
            const p2 = document.getElementById('password2').value;
            if (p1 !== p2) { showMessage('Passwords do not match.'); return; }
            const token = new URLSearchParams(location.search).get('token') || '';
            const res = await fetch('/api/auth/reset', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, password: p1 })
            });
            if (res.ok) { location.href = '/adminjd'; return; }
            let data = {};
            try { data = await res.json(); } catch (err) { /* empty */ }
            showMessage(data.error || 'Reset failed.');
        };
    </script>
</body>
</html>
